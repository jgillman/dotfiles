# -- General -------------------------------------------------------------------

set -g default-terminal "screen-256color"

# Enable 'extended-keys' if supported for Control + Shift bindings
%if #{>=:#{version},3.2}
set -g extended-keys on
%endif

set -g extended-keys-format csi-u

set -s escape-time 10       # No delay for escapes
set -sg repeat-time 600     # more time for repeat commands like window resize
set -s focus-events on

set -g prefix C-a           # Remap prefix to Control + a
unbind C-b

bind -N "Send regular C-a" a send-prefix          # Map Control + a then a to regular Control + a

set -q -g status-utf8 on
setw -q -g utf8 on

set -g history-limit 100000 # increase history size


# Use Emacs bindings on the command line
set -g status-keys emacs

# Use Vim bindings when in copy mode
set -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind -Tcopy-mode-vi 'v' send -X begin-selection

# Setup 'y' to copy selection as in Vim
bind -Tcopy-mode-vi 'y' send -X copy-selection-and-cancel

set -s set-clipboard on

# Popup to today's note
bind -N "Open a popup window with today's Obsidian note" C-t display-popup -w 100 -h 80% -E nvim -c "cd ~/Sync/notes/personal" -c "Obsidian today"

# reload config
bind -N "Reload tmux config" r {
  # source-file -F "#{config_files}"
  source-file "~/.config/tmux/tmux.conf"
  display-message "tmux config reloaded"
}

unbind C-/


# -- Display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# Don't show activity on windows
set -g monitor-activity off
set -g visual-activity off

# Needed for displaying images
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment " MOSHI_CLIENT"


# -- Navigation ----------------------------------------------------------------

# Create session
bind -N "Create new session" C-c command-prompt -p "New session name:" 'new-session -s %%'

# Rename session
bind -N "Rename current session" C-r command-prompt -I "#{session_name}" -p "Rename session:" 'rename-session %%'

# session navigation
bind -N "Switch to last client" Tab switch-client -l

bind -N "Split window horizontally" - split-window -v -c "#{pane_current_path}"
bind -N "Split window vertically" _ split-window -h -c "#{pane_current_path}"

bind -N "Swap current pane with the next one (repeatable)" -r > swap-pane -D
bind -N "Swap current pane with the previous one (repeatable)" -r < swap-pane -U

# Smart pane switching with awareness of vim splits
# See https://github.com/aserowy/tmux.nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"
bind -N "Select the pane below the active pane" -n 'C-k' if "$is_vim" 'send C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind -N "Select the pane below the active pane" -n 'C-j' if "$is_vim" 'send C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind -N "Select the pane to the left of the active pane" -n 'C-h' if "$is_vim" 'send C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind -N "Select the pane to the left of the active pane" -n 'C-l' if "$is_vim" 'send C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Allow pane switching while in copy-mode
bind -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# pane resizing
bind -N "Resize pane up (repeatable)" -r K resize-pane -U 2
bind -N "Resize pane down (repeatable)" -r J resize-pane -D 2
bind -N "Resize pane left (repeatable)" -r H resize-pane -L 2
bind -N "Resize pane right (repeatable)" -r L resize-pane -R 2

# Toggle mouse mode (default on)
set -g mouse on
bind -N "Toggle mouse mode on/off" m {
  set -g mouse
  display "mouse: #{?mouse,on,off}"
}

# Quick window cycling
unbind ^A
bind -N "Select last (previously selected) window" ^A select-window -l

# Browse URLs in current window
bind -N "Browse URLs in current window with urlscan" u {
  capture-pane -J -S -10 -b 'url-capture'
  split-window "tmux save-buffer -b 'url-capture' - | urlscan --compact --dedupe --single --colors true --regex 'https?://.+'"
}

bind -N "Choose which buffer to paste from" P choose-buffer

# Use tmux-palette if it's installed
# https://github.com/eduwass/tmux-palette
if-shell '[ -r "$HOME/Code/tmux-palette/bin/tmux-palette.sh" ]' {
  bind -n C-Space run-shell "$HOME/Code/tmux-palette/bin/tmux-palette.sh"
}

