set -g status-left ' #S  '
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-style 'fg=#{white} bg=#{background}'

# Keep Moshi swipe-to-change-window detection clean when launched from the iOS client.
if-shell '[ -n "$MOSHI_CLIENT" ]' {
  set -g status-left ''
  set -g status-right ''
}

set -g clock-mode-style 12

set -g pane-border-indicators both
set -g pane-border-style 'fg=#{brightblack}'
set -g pane-active-border-style 'fg=#{blue}'

set -g window-status-style 'bg=default fg=default'
set -g window-status-current-style 'bg=#{magenta} fg=#{black}'
set -g window-status-last-style 'bg=#{comment} fg=default'

set -g message-style 'bg=#{magenta} fg=#{black}'

set -g copy-mode-position-style 'bg=#{blue}'
set -g copy-mode-selection-style 'bg=#{selection}'


